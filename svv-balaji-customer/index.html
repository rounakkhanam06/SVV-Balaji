<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />

    <!--
      The only one of the three front ends a member of the public opens, and
      most of them will open it from a QR code on a pack, on a phone, holding
      the pack in the other hand. Phone-first is not a nice-to-have here.
    -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />

    <title>Desi Tokri — Farm to Fork</title>
    <meta
      name="description"
      content="Traceable millet and grain products from Desi Tokri. Scan the pack to see the farm it came from."
    />
    <!-- Mobile & PWA Phone Status Bar Colors (Prevents black notch/status bar on phones) -->
    <meta name="theme-color" content="#059669" />
    <meta name="theme-color" media="(prefers-color-scheme: light)" content="#059669" />
    <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#059669" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Desi Tokri" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="msapplication-navbutton-color" content="#059669" />
    <meta name="msapplication-TileColor" content="#059669" />

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700;800;900&family=Outfit:wght@500;600;700;800;900&display=swap" rel="stylesheet">
    <link rel="icon" type="image/png" sizes="32x32" href="/images/desi-tokri.png" />
    <link rel="apple-touch-icon" href="/images/desi-tokri.png" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
